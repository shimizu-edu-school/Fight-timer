<title>FIGHT TIMER</title>
<style>
  :root{--bg:#101010;--panel:#1b1b1b;--text:#f4f4f4;--muted:#a7a7a7;--accent:#e8e8e8;--danger:#ff5a5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;min-height:100dvh}
  .app{max-width:760px;margin:auto;padding:18px 16px 28px}
  h1{margin:0 0 14px;text-align:center;letter-spacing:.16em;font-size:20px}
  .display{background:#050505;border:1px solid #333;border-radius:18px;padding:18px 12px 20px;text-align:center;box-shadow:0 8px 30px #0008}
  .phase{font-size:18px;font-weight:800;letter-spacing:.12em;min-height:28px}
  .round{font-size:28px;font-weight:900;margin-top:4px}
  .time{font-variant-numeric:tabular-nums;font-size:clamp(76px,22vw,150px);font-weight:900;line-height:.95;letter-spacing:.02em;margin:14px 0 10px}
  .hint{font-size:14px;color:var(--muted);min-height:21px}
  .controls{margin-top:16px;background:var(--panel);border-radius:16px;padding:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;color:#ddd;font-size:13px;font-weight:700}
  select{width:100%;margin-top:6px;background:#090909;color:white;border:1px solid #444;border-radius:10px;padding:12px;font-size:17px}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  button{border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:900;background:#eee;color:#111}
  button.secondary{background:#383838;color:white}
  button:disabled{opacity:.4}
  .status{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
  .flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:white;transition:opacity .08s}
  .flash.on{opacity:.08}
  @media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.controls{padding:13px}.app{padding-top:12px}}
</style>
</head>
<body>
<div class="app">
  <h1>FIGHT TIMER</h1>

  <section class="display" aria-live="polite">
    <div id="phase" class="phase">READY</div>
    <div id="round" class="round">ROUND 1 / 3</div>
    <div id="time" class="time">01:00</div>
    <div id="hint" class="hint">設定して START</div>
  </section>

  <section class="controls">
    <div class="grid">
      <label>ラウンド数
        <select id="rounds">
          <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
          <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
        </select>
      </label>
      <label>1ラウンド
        <select id="roundTime"></select>
      </label>
      <label>インターバル
        <select id="interval"></select>
      </label>
      <label>開始前アイドル
        <select id="idle"></select>
      </label>
    </div>
    <div class="buttons">
      <button id="start">START</button>
      <button id="reset" class="secondary">RESET</button>
    </div>
    <div id="status" class="status">画面スリープ防止：準備中</div>
  </section>
</div>
<div id="flash" class="flash"></div>

<!-- オーディオファイル -->
<audio id="audioGong" preload="auto">
  <source src="bell.mp3" type="audio/mpeg">
</audio>
<audio id="audio30sec" preload="auto">
  <source src="30_seconds.mp3" type="audio/mpeg">
</audio>
<audio id="audio10sec" preload="auto">
  <source src="10_seconds.mp3" type="audio/mpeg">
</audio>

<script>
  // Service Worker登録
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.log('Service Worker登録失敗:', err);
    });
  }
</script>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const phase=$("phase"), roundEl=$("round"), timeEl=$("time"), hint=$("hint"), status=$("status");
  const roundsSel=$("rounds"), roundTimeSel=$("roundTime"), intervalSel=$("interval"), idleSel=$("idle");
  const startBtn=$("start"), resetBtn=$("reset");

  let timerId=null, endAt=0, state="ready", round=1, totalRounds=3;
  let wakeLock=null, audioCtx=null;
  let lastWhole=-1;

  // Populate settings.
  roundTimeSel.innerHTML="";
  for(let m=1;m<=10;m++){
    const o=document.createElement("option");
    o.value=m*60; o.textContent=m+"分"; roundTimeSel.appendChild(o);
  }
  roundTimeSel.value="3";

  intervalSel.innerHTML="";
  for(let s=0;s<=60;s+=5){
    const o=document.createElement("option");
    o.value=s; o.textContent=s+"秒"; intervalSel.appendChild(o);
  }
  intervalSel.value="60";

  idleSel.innerHTML="";
  for(let s=0;s<=30;s+=5){
    const o=document.createElement("option");
    o.value=s; o.textContent=s+"秒"; idleSel.appendChild(o);
  }
  idleSel.value="10";

  function fmt(sec){
    sec=Math.max(0,Math.ceil(sec));
    return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  }

  function updateDisplay(sec){
    timeEl.textContent=fmt(sec);
    roundEl.textContent=`ROUND ${round} / ${totalRounds}`;
  }

  function audioReady(){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==="suspended") audioCtx.resume();
      return true;
    }catch(e){ return false; }
  }

  function beep(freq,duration,volume,delay=0){
    if(!audioReady()) return;
    const t=audioCtx.currentTime+delay;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(freq,t);
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(volume,t+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+duration+0.03);
  }

  function gong(){
    // Play bell.mp3
    const audio = document.getElementById('audioGong');
    if(audio){
      audio.currentTime = 0;
      audio.play().catch(e => {
        // フォールバック：再生失敗時は何もしない
        console.log('Audio playback failed:', e);
      });
    }
  }

  function clack(){
    // Dry wooden-clapper approximation using a short noise burst.
    if(!audioReady()) return;
    const sr=audioCtx.sampleRate, len=Math.floor(sr*0.13);
    const buf=audioCtx.createBuffer(1,len,sr);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(sr*0.018));
    const src=audioCtx.createBufferSource();
    const filter=audioCtx.createBiquadFilter();
    const gain=audioCtx.createGain();
    filter.type="bandpass"; filter.frequency.value=1500; filter.Q.value=.7;
    gain.gain.value=.9;
    src.buffer=buf; src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
  }

  function voiceNumber(word){
    // Uses speech synthesis when available; falls back to a beep.
    if("speechSynthesis" in window){
      try{
        window.speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(word);
        u.lang="en-US"; u.rate=.9; u.pitch=1;
        window.speechSynthesis.speak(u);
        return;
      }catch(e){}
    }
    beep(700,.16,.3);
  }

  async function enableWakeLock(){
    if(!("wakeLock" in navigator)){
      status.textContent="画面スリープ防止：非対応ブラウザ";
      return;
    }
    try{
      if(wakeLock) await wakeLock.release().catch(()=>{});
      wakeLock=await navigator.wakeLock.request("screen");
      status.textContent="画面スリープ防止：ON";
      wakeLock.addEventListener("release",()=>{ if(state!=="ready") status.textContent="画面スリープ防止：再取得待ち"; });
    }catch(e){
      status.textContent="画面スリープ防止：取得できませんでした";
    }
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible" && state!=="ready") enableWakeLock();
  });

  function setPhase(next,seconds,message=""){
    state=next;
    endAt=performance.now()+seconds*1000;
    lastWhole=Math.ceil(seconds);
    phase.textContent=next==="idle"?"GET READY":next==="round"?"ROUND":next==="interval"?"INTERVAL":"READY";
    hint.textContent=message;
    updateDisplay(seconds);
  }

  function stopTimer(){
    if(timerId!==null) cancelAnimationFrame(timerId);
    timerId=null;
  }

  function loop(){
    if(state==="ready") return;
    const seconds=Math.max(0,(endAt-performance.now())/1000);
    const whole=Math.ceil(seconds);
    updateDisplay(seconds);

    if(state==="round" && whole===10 && lastWhole>10){
      clack();
      setTimeout(clack,350);
    }

    if(state==="interval"){
      if(whole===30 && lastWhole>30){ 
        const audio30 = document.getElementById('audio30sec');
        if(audio30){
          audio30.currentTime = 0;
          audio30.play().catch(e => console.log('Audio playback failed:', e));
        }
      }
      else if(whole===10 && lastWhole>10){ 
        const audio10 = document.getElementById('audio10sec');
        if(audio10){
          audio10.currentTime = 0;
          audio10.play().catch(e => console.log('Audio playback failed:', e));
        }
      }
      else if(whole===5 && lastWhole>5){ hint.textContent="FIVE"; voiceNumber("five"); }
      else if(whole===4 && lastWhole>4){ hint.textContent="FOUR"; voiceNumber("four"); }
      else if(whole===3 && lastWhole>3){ hint.textContent="THREE"; voiceNumber("three"); }
      else if(whole===2 && lastWhole>2){ hint.textContent="TWO"; voiceNumber("two"); }
      else if(whole===1 && lastWhole>1){ hint.textContent="ONE"; voiceNumber("one"); }
    }

    lastWhole=whole;
    if(seconds<=0){
      advance();
      return;
    }
    timerId=requestAnimationFrame(loop);
  }

  function beginLoop(){
    stopTimer();
    timerId=requestAnimationFrame(loop);
  }

  function advance(){
    stopTimer();

    if(state==="idle"){
      gong();
      setPhase("round",Number(roundTimeSel.value),"FIGHT!");
      beginLoop();
      return;
    }

    if(state==="round"){
      gong();
      if(round>=totalRounds){
        finish();
        return;
      }
      const rest=Number(intervalSel.value);
      if(rest<=0){
        round++;
        gong();
        setPhase("round",Number(roundTimeSel.value),"FIGHT!");
        beginLoop();
      }else{
        setPhase("interval",rest,"");
        beginLoop();
      }
      return;
    }

    if(state==="interval"){
      round++;
      gong();
      setPhase("round",Number(roundTimeSel.value),"FIGHT!");
      beginLoop();
    }
  }

  function finish(){
    stopTimer();
    state="ready";
    phase.textContent="FINISHED";
    roundEl.textContent=`ROUND ${totalRounds} / ${totalRounds}`;
    timeEl.textContent="00:00";
    hint.textContent="お疲れさまでした";
    startBtn.disabled=false;
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
    status.textContent="画面スリープ防止：OFF";
  }

  startBtn.addEventListener("click",async()=>{
    audioReady();
    totalRounds=Number(roundsSel.value);
    round=1;
    startBtn.disabled=true;
    await enableWakeLock();

    const idle=Number(idleSel.value);
    if(idle>0){
      setPhase("idle",idle,"開始まで");
      beginLoop();
    }else{
      state="idle";
      advance();
    }
  });

  resetBtn.addEventListener("click",()=>{
    stopTimer();
    state="ready";
    round=1;
    totalRounds=Number(roundsSel.value);
    startBtn.disabled=false;
    phase.textContent="READY";
    roundEl.textContent=`ROUND 1 / ${totalRounds}`;
    updateDisplay(Number(roundTimeSel.value));
    hint.textContent="設定して START";
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
    status.textContent="画面スリープ防止：準備中";
  });

  roundsSel.addEventListener("change",()=>{
    if(state==="ready"){
      totalRounds=Number(roundsSel.value);
      roundEl.textContent=`ROUND 1 / ${totalRounds}`;
    }
  });

  roundTimeSel.addEventListener("change",()=>{
    if(state==="ready") updateDisplay(Number(roundTimeSel.value));
  });

  updateDisplay(Number(roundTimeSel.value));
})();
</script>
</body>

  async function enableWakeLock(){
    if(!("wakeLock" in navigator)){
      status.textContent="画面スリープ防止：非対応ブラウザ";
      return;
    }
    try{
      if(wakeLock) await wakeLock.release().catch(()=>{});
      wakeLock=await navigator.wakeLock.request("screen");
      status.textContent="画面スリープ防止：ON";
      wakeLock.addEventListener("release",()=>{ if(state!=="ready") status.textContent="画面スリープ防止：再取得待ち"; });
    }catch(e){
      status.textContent="画面スリープ防止：取得できませんでした";
    }
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible" && state!=="ready") enableWakeLock();
  });

  function setPhase(next,seconds,message=""){
    state=next;
    endAt=performance.now()+seconds*1000;
    lastWhole=Math.ceil(seconds);
    phase.textContent=next==="idle"?"GET READY":next==="round"?"ROUND":next==="interval"?"INTERVAL":"READY";
    hint.textContent=message;
    updateDisplay(seconds);
  }

  function stopTimer(){
    if(timerId!==null) cancelAnimationFrame(timerId);
    timerId=null;
  }

  function loop(){
    if(state==="ready") return;
    const seconds=Math.max(0,(endAt-performance.now())/1000);
    const whole=Math.ceil(seconds);
    updateDisplay(seconds);

    if(state==="round" && whole===10 && lastWhole>10){
      clack();
      setTimeout(clack,350);
    }

    if(state==="interval"){
      if(whole===5 && lastWhole>5){ hint.textContent="FIVE"; voiceNumber("five"); }
      else if(whole===4 && lastWhole>4){ hint.textContent="FOUR"; voiceNumber("four"); }
      else if(whole===3 && lastWhole>3){ hint.textContent="THREE"; voiceNumber("three"); }
      else if(whole===2 && lastWhole>2){ hint.textContent="TWO"; voiceNumber("two"); }
      else if(whole===1 && lastWhole>1){ hint.textContent="ONE"; voiceNumber("one"); }
    }

    lastWhole=whole;
    if(seconds<=0){
      advance();
      return;
    }
    timerId=requestAnimationFrame(loop);
  }

  function beginLoop(){
    stopTimer();
    timerId=requestAnimationFrame(loop);
  }

  function advance(){
    stopTimer();

    if(state==="idle"){
      gong();
      setPhase("round",Number(roundTimeSel.value),"FIGHT!");
      beginLoop();
      return;
    }

    if(state==="round"){
      gong();
      if(round>=totalRounds){
        finish();
        return;
      }
      const rest=Number(intervalSel.value);
      if(rest<=0){
        round++;
        gong();
        setPhase("round",Number(roundTimeSel.value),"FIGHT!");
        beginLoop();
      }else{
        setPhase("interval",rest,"");
        beginLoop();
      }
      return;
    }

    if(state==="interval"){
      round++;
      gong();
      setPhase("round",Number(roundTimeSel.value),"FIGHT!");
      beginLoop();
    }
  }

  function finish(){
    stopTimer();
    state="ready";
    phase.textContent="FINISHED";
    roundEl.textContent=`ROUND ${totalRounds} / ${totalRounds}`;
    timeEl.textContent="00:00";
    hint.textContent="お疲れさまでした";
    startBtn.disabled=false;
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
    status.textContent="画面スリープ防止：OFF";
  }

  startBtn.addEventListener("click",async()=>{
    audioReady();
    totalRounds=Number(roundsSel.value);
    round=1;
    startBtn.disabled=true;
    await enableWakeLock();

    const idle=Number(idleSel.value);
    if(idle>0){
      setPhase("idle",idle,"開始まで");
      beginLoop();
    }else{
      state="idle";
      advance();
    }
  });

  resetBtn.addEventListener("click",()=>{
    stopTimer();
    state="ready";
    round=1;
    totalRounds=Number(roundsSel.value);
    startBtn.disabled=false;
    phase.textContent="READY";
    roundEl.textContent=`ROUND 1 / ${totalRounds}`;
    updateDisplay(Number(roundTimeSel.value));
    hint.textContent="設定して START";
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
    status.textContent="画面スリープ防止：準備中";
  });

  roundsSel.addEventListener("change",()=>{
    if(state==="ready"){
      totalRounds=Number(roundsSel.value);
      roundEl.textContent=`ROUND 1 / ${totalRounds}`;
    }
  });

  roundTimeSel.addEventListener("change",()=>{
    if(state==="ready") updateDisplay(Number(roundTimeSel.value));
  });

  updateDisplay(Number(roundTimeSel.value));
})();
</script>
</body>
</html>
